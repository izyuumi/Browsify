name: Create Tappa App Store Connect record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Create bundle ID and app record
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "uri"

          def b64url(value)
            Base64.urlsafe_encode64(value, padding: false)
          end

          key = OpenSSL::PKey.read(ENV.fetch("ASC_API_KEY_P8"))
          now = Time.now.to_i
          header = b64url(JSON.generate(alg: "ES256", kid: ENV.fetch("ASC_KEY_ID"), typ: "JWT"))
          payload = b64url(JSON.generate(iss: ENV.fetch("ASC_ISSUER_ID"), iat: now - 30, exp: now + 600, aud: "appstoreconnect-v1"))
          signing_input = "#{header}.#{payload}"
          der = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(signing_input))
          sequence = OpenSSL::ASN1.decode(der)
          raw_signature = sequence.value.map { |integer| integer.value.to_s(2).rjust(32, "\0") }.join
          token = "#{signing_input}.#{b64url(raw_signature)}"

          def request(token, method, path, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            request = method == :get ? Net::HTTP::Get.new(uri) : Net::HTTP::Post.new(uri)
            request["Authorization"] = "Bearer #{token}"
            request["Content-Type"] = "application/json"
            request.body = JSON.generate(body) if body
            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
            parsed = JSON.parse(response.body)
            unless response.is_a?(Net::HTTPSuccess)
              warn JSON.generate(parsed)
              abort "App Store Connect API failed: #{response.code}"
            end
            parsed
          end

          bundle_identifier = "to.yumi.Tappa"
          filter = URI.encode_www_form("filter[identifier]" => bundle_identifier, "limit" => "1")
          bundle = request(token, :get, "/v1/bundleIds?#{filter}").fetch("data").first
          unless bundle
            bundle = request(token, :post, "/v1/bundleIds", {
              data: {
                type: "bundleIds",
                attributes: {
                  identifier: bundle_identifier,
                  name: "Tappa",
                  platform: "IOS"
                }
              }
            }).fetch("data")
          end

          app_filter = URI.encode_www_form("filter[bundleId]" => bundle.fetch("id"), "limit" => "1")
          app = request(token, :get, "/v1/apps?#{app_filter}").fetch("data").first
          unless app
            app = request(token, :post, "/v1/apps", {
              data: {
                type: "apps",
                attributes: {
                  name: "Tappa Day",
                  primaryLocale: "en-US",
                  sku: "tappa-ios-2026"
                },
                relationships: {
                  bundleId: {
                    data: {
                      type: "bundleIds",
                      id: bundle.fetch("id")
                    }
                  }
                }
              }
            }).fetch("data")
          end

          puts "Bundle ID ready: #{bundle.fetch("id")}"
          puts "App record ready: #{app.fetch("id")}"
          RUBY
